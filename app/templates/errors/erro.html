{% extends "base.html" %}
{% import "macros/ui.html" as ui %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block body %}
<main class="flex min-h-full flex-col items-center justify-center px-6 py-16 text-center">
  <a href="{{ url_for('main.homepage') }}" aria-label="MinhaAcademia">{{ ui.logo() }}</a>
  <p class="mt-12 font-display text-sm font-semibold uppercase tracking-wider text-amarelo-600">Erro {{ codigo }}</p>
  <h1 class="mt-2 font-display text-3xl font-semibold tracking-tight text-navy-900 sm:text-4xl">{{ titulo }}</h1>
  <p class="mt-3 max-w-md text-base text-slate-600">{{ mensagem }}</p>
  <div class="mt-8">
    <a href="{{ url_for('main.homepage') }}" class="btn btn-escuro">{{ ui.icone("seta-esquerda", "h-4 w-4") }}Voltar ao início</a>
  </div>
</main>
{% endblock %}
